services:
  - type: web
    name: studentbusmanagement
    runtime: python
    runtimeVersion: 3.12
    buildCommand: |
      pip install -r busproject/requirements.txt
      cd busproject
      python manage.py collectstatic --no-input
    startCommand: cd busproject && gunicorn busproject.wsgi:application
    envVars:
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://your-app-name.onrender.com
      - key: DATABASE_URL
        sync: false
databases:
  - name: studentbus_db
    databaseName: studentbus_db
    user: postgres
